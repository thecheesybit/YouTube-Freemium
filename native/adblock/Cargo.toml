[package]
name = "movy-adblock"
version = "0.1.0"
edition = "2021"
description = "Thin, thread-safe wrapper around Brave's adblock-rust for the Movy shells"

[lib]
name = "movy_adblock"
crate-type = ["cdylib", "rlib"]

[features]
default = []
jni = ["dep:jni"]

[dependencies]
adblock = { version = "0.13.5", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jni = { version = "0.21", optional = true }

[[bin]]
name = "build-engine"
path = "src/bin/build-engine.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
