apply plugin: 'com.android.application'

import groovy.json.JsonSlurper

// Per-app values are generated by scripts/build-android.mjs; never edit them by hand.
def movyFile = file('movy.generated.json')
def movy = movyFile.exists() ? new JsonSlurper().parse(movyFile) : [
    appId: 'app.movy.shell', appName: 'Movy', version: '1.0.0', versionCode: 1,
    orientation: 'unspecified', cleartext: false, signing: null,
    defaultsKey: 'AAAAAAAAAAAAAAAAAAAAAA==', remote: null
]
def firebaseEnabled = movy.remote != null

android {
    namespace = "app.movy.shell"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId movy.appId
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode movy.versionCode
        versionName movy.version
        manifestPlaceholders = [
            movyCleartext  : movy.cleartext ? 'true' : 'false',
            movyOrientation: movy.orientation
        ]
        buildConfigField "String", "MOVY_KEY", "\"${movy.defaultsKey}\""
        buildConfigField "int", "MOVY_BUILD", "${movy.versionCode}"
        buildConfigField "boolean", "MOVY_REMOTE", "${firebaseEnabled}"
        buildConfigField "String", "MOVY_REMOTE_PARAM", "\"${firebaseEnabled ? movy.remote.parameter : ''}\""
        resValue "string", "app_name", movy.appName
        resValue "string", "title_activity_main", movy.appName
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // Firebase Remote Config is compiled in only when the app config has `remote`.
    sourceSets {
        main.java.srcDirs += firebaseEnabled ? 'src/firebase/java' : 'src/nofirebase/java'
    }

    flavorDimensions = ["form"]
    productFlavors {
        phone { dimension = "form" }
        tv {
            dimension = "form"
            applicationIdSuffix = ".tv"
        }
    }

    signingConfigs {
        release {
            if (movy.signing) {
                storeFile file(movy.signing.storeFile)
                storePassword movy.signing.storePassword
                keyAlias movy.signing.keyAlias
                keyPassword movy.signing.keyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Same key as release so debug and release builds update each other in place.
            if (movy.signing) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (movy.signing) signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20231013'
    if (firebaseEnabled) {
        implementation platform('com.google.firebase:firebase-bom:33.7.0')
        implementation 'com.google.firebase:firebase-config'
    }
}

// No analytics, ever.
configurations.all {
    exclude group: 'com.google.firebase', module: 'firebase-analytics'
}

apply from: 'capacitor.build.gradle'

if (firebaseEnabled) {
    apply plugin: 'com.google.gms.google-services'
}
