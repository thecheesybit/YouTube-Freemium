<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{APP_NAME}}</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; background: {{BG}}; color: #e8e8e8; font: 16px system-ui, sans-serif; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0; }
  p { margin: 0; opacity: .75; max-width: 28em; }
  button { font: inherit; padding: 12px 28px; border-radius: 10px; border: 2px solid transparent; background: #3b82f6; color: #fff; }
  button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Can't reach {{APP_NAME}}</h1>
  <p>Check your connection. This page retries automatically.</p>
  <button id="retry" autofocus>Retry</button>
</main>
<script>
  var TARGET = {{URL_JSON}};
  function retry() { location.href = TARGET; }
  document.getElementById('retry').addEventListener('click', retry);
  window.addEventListener('online', retry);
  setInterval(function () { if (navigator.onLine) retry(); }, 8000);
</script>
</body>
</html>
