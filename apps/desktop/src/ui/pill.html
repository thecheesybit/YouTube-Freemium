<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #pill {
      margin-top: 10px;
      padding: 10px 20px;
      background: rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      transform-origin: center top;
      opacity: 0;
      transform: translateY(-36px) scale(0.25, 0.55);
      pointer-events: none;
    }
    #pill.showing {
      animation: dropIn 420ms cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
    }
    #pill.hiding {
      animation: riseOut 260ms cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }
    @keyframes dropIn {
      0% {
        opacity: 0;
        transform: translateY(-36px) scale(0.25, 0.55);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1, 1);
      }
    }
    @keyframes riseOut {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1, 1);
      }
      100% {
        opacity: 0;
        transform: translateY(-36px) scale(0.25, 0.55);
      }
    }
  </style>
</head>
<body>
  <div id="pill">Skipping ads for you</div>
  <script>
    const el = document.getElementById('pill');
    function showPill() {
      el.classList.remove('hiding');
      el.classList.add('showing');
    }
    function hidePill() {
      el.classList.remove('showing');
      el.classList.add('hiding');
    }
    window.showPill = showPill;
    window.hidePill = hidePill;
  </script>
</body>
</html>
