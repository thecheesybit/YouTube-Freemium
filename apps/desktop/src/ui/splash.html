<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Freemium</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      perspective: 8000px;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #phase-one {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 420ms ease-out, transform 420ms ease-out;
    }
    #icon {
      width: 112px;
      height: 112px;
      opacity: 0;
      transform: scale(0.86);
      transition: opacity 480ms cubic-bezier(0, 0, 0.2, 1), transform 480ms cubic-bezier(0, 0, 0.2, 1);
    }
    #title {
      margin-top: 18px;
      font-size: 40px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: 0.02em;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 160ms ease-out, transform 160ms ease-out;
    }
    #tagline {
      margin-top: 6px;
      font-size: 18px;
      color: #B8B8BD;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 260ms ease-out, transform 260ms ease-out;
    }
    #spinner {
      margin-top: 28px;
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 0, 51, 0.2);
      border-top-color: #FF0033;
      border-radius: 50%;
      animation: spin 800ms linear infinite;
      opacity: 0;
      transition: opacity 200ms ease-in;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #footer {
      position: absolute;
      bottom: 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #636366;
      font-size: 11px;
      opacity: 0;
      transition: opacity 320ms ease-out;
    }

    #phase-two {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(18px) scale(0.5);
      transform-style: preserve-3d;
      transition: opacity 620ms cubic-bezier(0.175, 0.885, 0.32, 1.15),
                  transform 620ms cubic-bezier(0.175, 0.885, 0.32, 1.15);
    }
    #phase-two.flipping {
      transition: opacity 280ms cubic-bezier(0.4, 0, 1, 1),
                  transform 280ms cubic-bezier(0.4, 0, 1, 1);
      opacity: 0 !important;
      transform: rotateY(90deg) !important;
    }
    #crafted {
      font-size: 18px;
      color: #B8B8BD;
      letter-spacing: 0.12em;
    }
    #author {
      margin-top: 6px;
      font-size: 44px;
      font-weight: 700;
      color: #FFFFFF;
    }
    #heart {
      color: #FF2D55;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="phase-one">
      <img id="icon" alt="YouTube Freemium">
      <div id="title">YouTube Freemium</div>
      <div id="tagline">Ad-free YouTube and YouTube Music</div>
      <div id="spinner"></div>
    </div>

    <div id="phase-two">
      <div id="crafted">Crafted by</div>
      <div id="author">Ayush Kumar <span id="heart">&hearts;</span></div>
    </div>

    <div id="footer">
      <div>v1.0.0 (build 1)</div>
    </div>
  </div>

  <script>
    // Web Audio Synthesizer for Splash Chimes
    function createAudio() {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        return new AudioContext();
      } catch {
        return null;
      }
    }

    const audioCtx = createAudio();

    function playTone(freq, duration, gainVal, startDelay) {
      if (!audioCtx) return;
      setTimeout(() => {
        try {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const now = audioCtx.currentTime;
          const osc1 = audioCtx.createOscillator();
          const osc2 = audioCtx.createOscillator();
          const gain = audioCtx.createGain();

          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);

          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(freq * 2, now); // 25% 2nd harmonic

          const g1 = audioCtx.createGain();
          g1.gain.setValueAtTime(1.0, now);
          const g2 = audioCtx.createGain();
          g2.gain.setValueAtTime(0.25, now);

          osc1.connect(g1);
          osc2.connect(g2);
          g1.connect(gain);
          g2.connect(gain);
          gain.connect(audioCtx.destination);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(gainVal, now + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + duration);
          osc2.stop(now + duration);
        } catch {}
      }, startDelay);
    }

    // 0s: Rising 4-note chime (C5 E5 G5 C6, 95ms apart, gain ~0.3)
    function playIntroChime() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => playTone(f, 0.65, 0.30, i * 95));
    }

    // 2.35s: Warm resolving chord (G4 C5 E5, 70ms apart, gain ~0.26)
    function playCreditChord() {
      const notes = [392.0, 523.25, 659.25];
      notes.forEach((f, i) => playTone(f, 0.80, 0.26, i * 70));
    }

    // Timeline execution
    const p1 = document.getElementById('phase-one');
    const icon = document.getElementById('icon');
    // The app passes its icon as a data URL in the hash (the file path differs between dev and the packaged app).
    try { const d = decodeURIComponent(location.hash.slice(1)); if (d.startsWith('data:image/')) icon.src = d; } catch (e) {}
    const title = document.getElementById('title');
    const tagline = document.getElementById('tagline');
    const spinner = document.getElementById('spinner');
    const footer = document.getElementById('footer');
    const p2 = document.getElementById('phase-two');

    // T = 0ms: icon, title, tagline in
    requestAnimationFrame(() => {
      icon.style.opacity = '1';
      icon.style.transform = 'scale(1)';
      title.style.opacity = '1';
      title.style.transform = 'translateY(0)';
      tagline.style.opacity = '1';
      tagline.style.transform = 'translateY(0)';
      footer.style.opacity = '1';
      playIntroChime();
    });

    // T = 400ms: spinner appears
    setTimeout(() => {
      spinner.style.opacity = '1';
    }, 400);

    // T = 2000ms: phase one steps aside
    setTimeout(() => {
      p1.style.opacity = '0';
      p1.style.transform = 'scale(0.88)';
      footer.style.opacity = '0';
    }, 2000);

    // T = 2350ms: phase two enters with overshoot
    setTimeout(() => {
      playCreditChord();
      p2.style.opacity = '1';
      p2.style.transform = 'translateY(0) scale(1)';
    }, 2350);

    // T = 3150ms: phase two flips away
    setTimeout(() => {
      p2.classList.add('flipping');
    }, 3150);

    // T = 3500ms: finish
    setTimeout(() => {
      if (window.electronBridge && window.electronBridge.splashDone) {
        window.electronBridge.splashDone();
      }
    }, 3500);
  </script>
</body>
</html>
